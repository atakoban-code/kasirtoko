name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Pasang ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Ikon aplikasi
        run: |
          IM=$(command -v magick || command -v convert)
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM www/icons/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
      - name: Ikon bar status gelap
        run: sed -i 's|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item><item name="android:windowLightStatusBar">true</item>|' android/app/src/main/res/values/styles.xml
      - name: Kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
