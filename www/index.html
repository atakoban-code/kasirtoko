.cs-vr {

}

}

}
.cs-si {

}
.cs-tx {

  min-width: 0;
  flex: 1;
}

  display: block;
  font-weight: 600;
  color: var(--mut);
  white-space: nowrap;
}
.cs-tx b {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.25;
}

}
.cs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}
.cs-tile {
  position: relative;

  align-items: center;
  text-align: left;
  font: inherit;
  color: var(--ink);

}

  font-weight: 800;
  color: #232a45;
}
.pur.kb b {
  color: #12805c;
}
.pur.kr b {
  color: #d92d20;
}
.pur.kb.on {
  background: #e3f5ec;

  padding: 6px 10px;
}
.cs-bd {

  right: -6px;
  top: -6px;
  z-index: 3;

  border-radius: 9px;

  color: #3b2a00;
  font-style: normal;
  font: 900 10px/15px sans-serif;
  text-align: center;

}
.cs-pl {

  right: -5px;
  bottom: -5px;

  height: 20px;
  border-radius: 50%;
  background: #ee2d2d;
  color: #fff;
  font-style: normal;
  font-weight: 900;
  font-size: 15px;
  line-height: 20px;
  text-align: center;
  border: 2px solid var(--card);
}
.cs-tt {
  display: block;
  flex: 1;
  border-left: 1px solid var(--line);
}
.cs-tt b {
  display: block;
  font-weight: 800;
  line-height: 1.15;
  color: var(--ink);
  overflow-wrap: normal;
  word-break: normal;
}
.cs-tt small {
  display: block;
  font-weight: 500;
  line-height: 1.2;
  color: var(--mut);
}
.cs-tile .ch {
  position: absolute;
  top: 50%;
}
.cs-tile .ch {
  stroke: var(--mut);
}
.cs-rs {
  display: flex;
  gap: 8px;
}
.cs-rs button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 6px;
  border: 1px solid var(--ln);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(0,0,0,.06);
}
.cs-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 12px 4px 0;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mut);
}
.cs-info button {
  border: 0;
  background: none;
  color: var(--ac);
  font: inherit;
  font-weight: 800;
  text-decoration: underline;
}
.cs-foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 18px 0 0;
  font-family: Georgia,'Times New Roman',serif;
  font-style: italic;
  color: var(--ink);
}
.cs-foot i {
  flex: 0 1 52px;
  height: 1px;
  background: var(--ink);
  opacity: .5;
}
.cs-wave {
  display: block;
  width: calc(100% + 24px);
  height: 104px;
  margin: auto -12px 0;
}
.cs-foot+.cs-wave {
  margin-top: auto;
}

/* ===== LAYAR DEPAN PENUH LAYAR (muat satu layar, gelombang menempel di tepi layar) ===== */
.cs0 {
  height: calc(100svh - env(safe-area-inset-top,0px) - 14px);
  padding-bottom: calc(58px + var(--sab,0px));
}
.cs0>svg.cs-tr {
  position: fixed;
  top: 0;
  right: 0;
  width: min(80%,560px);
  height: clamp(70px,13svh,120px);
}
.cs0>svg.cs-wave {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: calc(70px + var(--sab,0px));
  margin: 0;
  z-index: 0;
}
.cs-top {
  margin-bottom: 8px;
}
.cs-meta {
  margin-bottom: 8px;
}
.cs-stats {
  margin-bottom: 10px;
}
.cs-grid {
  flex: 1 1 0;
  min-height: 0;
}
.cs-tile {
  min-height: 0;
  overflow: hidden;
}
.cs-ic {
  border-radius: 14px;
}
.cs-ic svg {
  width: 60%;
  height: 60%;
}
.cs-tt small {
  font-size: clamp(9.5px,1.4svh,11px);
  margin-top: 2px;
}
.cs-rs {
  margin-top: 10px;
}
.cs-info {
  margin-top: 8px;
}
.cs-foot {
  margin-top: 10px;
  font-size: 16px;
}

/* ===== LAYAR DEPAN DIAM (tidak bergeser/memantul) ===== */
html:has(body.hm) {

  overscroll-behavior: none;
}
body.hm {
  position: fixed;
  inset: 0;
  width: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
.cs0 {
  min-height: 0;
}
.cs-grid {

/* ===== KUNCI APLIKASI: tidak bergeser, tidak goyang, tidak ter-zoom ===== */

}

}

body {
  max-width: 100%;

/* ===== SELISIH STOK: barang Plus/Minus dari Cek Stok yang sudah Selesai, menunggu konfirmasi =====
 Data tidak disalin: memakai snapshot Cek Stok (c.snap). Status per barang di c.adj[pid]:
 {st:'ok'|'skip', tgl, n}. Stok sistem baru berubah setelah konfirmasi, dan tercatat di Riwayat Stok. */
let SLF = "wait";
function selItems() {
  const out = [];
  D.chk.forEach((c) => {
    if (c.st !== "selesai" || !c.sel || !c.snap) return;
    c.snap.forEach((r) => {
      if (r.fis == null) return;
      const d = r.fis - r.sis;
      if (!d) return;
      out.push({ c, r, d, a: c.adj && c.adj[r.pid] });
    });
  });
  return out.reverse();
}
const selN = () => {
  try {
    return selItems().filter((x) => !x.a).length;
  } catch (e) {
    return 0;
  }
};
function selOld() {
  const o = {};
  let n = 0;
  D.chk.forEach((c) => {
    if (c.st !== "selesai" || c.sel || !c.snap) return;
    const k = c.snap.filter((r) => r.fis != null && r.fis !== r.sis).length;
    if (k) {
      o[c.id] = 1;
      n += k;
    }
  });
  return { n, ids: Object.keys(o) };
}
function selApplyOne(c, pid) {
  const r = c.snap.find((x) => x.pid === pid), p = D.prod.find((x) => x.id === pid);
  if (!r || c.adj && c.adj[pid]) return 0;
  if (!p) return -1;
  const d = r.fis - r.sis;
  let n = Math.abs(d);
  const t = today();
  if (d < 0) {
    n = Math.min(n, Math.max(0, +p.stok || 0));
    p.stok = (+p.stok || 0) - n;
    if (n > 0) D.moves.push({ pid, qty: n, tgl: t, t: "tk", src: "sel" });
  } else {
    p.stok = (+p.stok || 0) + n;
    D.moves.push({ pid, qty: n, tgl: t, src: "sel" });
  }
  (c.adj || (c.adj = {}))[pid] = { st: "ok", tgl: t, n: d < 0 ? -n : n };
  return 1;
}
const selDlg = (ic, h, msg, btn, fn, bg) => {
  $("wb").innerHTML = `<i>${ic}</i><h4>${h}</h4><p>${msg}</p><div class="row"><button class="btn" style="background:var(--line);color:#232a45;flex:1" onclick="$('warn').classList.remove('on')">Batal</button><button class="btn" style="background:${bg || "#ecd9a8"};flex:1" onclick="${fn}">${btn}</button></div>`;
  $("warn").classList.add("on");
};
function selAsk(cid, pid) {
  const c = D.chk.find((x) => x.id === cid), r = c && c.snap.find((x) => x.pid === pid), p = D.prod.find((x) => x.id === pid);
  if (!r) return;
  if (!p) return toast("Barang sudah tidak ada di Data Produk");
  const d = r.fis - r.sis, now = Math.max(0, +p.stok || 0), nw = Math.max(0, now + d);
  selDlg(d > 0 ? "➕" : "➖", d > 0 ? "Tambah stok sistem?" : "Kurangi stok sistem?", `<b>${esc(p.nama)}</b><br>Stok sistem sekarang ${esc(fqp(p, now))}<br>menjadi <b>${esc(fqp(p, nw))}</b> (${d > 0 ? "Plus +" : "Minus −"}${esc(fqp(p, Math.abs(d)))})<br>Tercatat di Riwayat Stok.`, "Ya, Sesuaikan", `selDo('${cid}','${pid}')`);
}
function selDo(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c) return;
  const r = selApplyOne(c, pid);
  save();
  $("warn").classList.remove("on");
  toast(r > 0 ? "Stok sistem sudah disesuaikan" : "Tidak ada yang diubah");
  render();
}
function selSkip(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c) return;
  (c.adj || (c.adj = {}))[pid] = { st: "skip", tgl: today() };
  save();
  render();
}
function selBack(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c || !c.adj) return;
  delete c.adj[pid];
  save();
  render();
}
function selAllAsk() {
  const w = selItems().filter((x) => !x.a && D.prod.some((p) => p.id === x.r.pid)), pl = w.filter((x) => x.d > 0).length, mn = w.length - pl;
  if (!w.length) return toast("Tidak ada selisih yang menunggu");
  selDlg("⚖️", "Sesuaikan semua selisih?", `${w.length} barang akan disesuaikan.<br><b>${pl}</b> barang Plus menambah stok sistem, <b>${mn}</b> barang Minus mengurangi stok sistem.<br>Tercatat di Riwayat Stok.`, "Ya, Sesuaikan Semua", "selAllDo()");
}
function selAllDo() {
  let n = 0;
  selItems().filter((x) => !x.a).forEach((x) => {
    if (selApplyOne(x.c, x.r.pid) > 0) n++;
  });
  save();
  $("warn").classList.remove("on");
  toast(n + " barang disesuaikan");
  render();
}
function selOldGo() {
  const o = selOld();
  D.chk.forEach((c) => {
    if (o.ids.includes(c.id)) c.sel = 1;
  });
  save();
  $("warn").classList.remove("on");
  render();
}
function selOldAsk() {
  const o = selOld();
  selDlg("📂", "Ambil selisih cek lama?", `Ada ${o.n} barang selisih dari Cek Stok yang selesai sebelum menu ini ada.<br>Jika stok sudah Anda betulkan manual, <b>jangan diambil</b> supaya tidak dobel.`, "Ya, Ambil", "selOldGo()");
}
function selExp() {
  const a = selItems().map((x) => ({ Tanggal: x.c.tglS ? fdh(x.c.tglS) : fdh(x.c.tgl), Cek: "Cek " + x.c.no, "Kode Barang": kb(x.r), Barang: x.r.nama, Sistem: fsv(x.r, x.r.sis), Fisik: fq(x.r.fis, x.r.isi, x.r.sb, x.r.satuan, x.r.sm, x.r.ir), "Selisih (satuan kecil)": x.d, Jenis: x.d > 0 ? "Plus" : "Minus", Status: x.a ? x.a.st === "ok" ? "Sudah disesuaikan " + x.a.tgl : "Diabaikan " + x.a.tgl : "Menunggu konfirmasi" }));
  if (!a.length) return toast("Belum ada data selisih");
  dlf("selisih-stok-" + (D.cg || "gudang") + ".xlsx", wbk(a, "Selisih Stok"));
}
function vSel() {
  const L = selItems(), w = L.filter((x) => !x.a), pl = w.filter((x) => x.d > 0).length, mn = w.length - pl, dn = L.filter((x) => x.a).length, old = selOld();
  $("acts").innerHTML = L.length ? `<button class="ib" onclick="selExp()">Excel</button>` : "";
  const ch = (k, l, n) => `<button class="chip${SLF === k ? " on" : ""}" onclick="SLF='${k}';LM=60;render()">${l} (${n})</button>`;
  let R = L;
  if (SLF === "wait") R = w;
  else if (SLF === "plus") R = w.filter((x) => x.d > 0);
  else if (SLF === "minus") R = w.filter((x) => x.d < 0);
  else if (SLF === "done") R = L.filter((x) => x.a);
